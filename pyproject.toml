    "pandas==2.2.3",
    "peft>=0.21.0",
    "pillow==10.4.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.2",
    "setuptools==69.5.1",
    "torch==2.4.0",
    "torchmetrics==1.4.0.post0",
